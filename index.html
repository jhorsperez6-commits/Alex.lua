function makeDraggable(guiObject, objectToMove, callback)
    local dragging, dragInput, dragStart, startPos, moved = false, nil, nil, nil, false
    local function isClickInput(input)
        return input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch
    end
    guiObject.InputBegan:Connect(function(input)
        if not isClickInput(input) then return end
        local target = input.Target
        if target and target ~= guiObject then
            if target:IsA("GuiButton") or target:FindFirstAncestorOfClass("GuiButton") then return end
        end
        dragging = true; moved = false; dragStart = input.Position; startPos = objectToMove.Position
    end)
    guiObject.InputChanged:Connect(function(input)
        if input.UserInputType == Enum.UserInputType.MouseMovement or input.UserInputType == Enum.UserInputType.Touch then
            dragInput = input
        end
    end)
    UserInputService.InputChanged:Connect(function(input)
        if input ~= dragInput or not dragging then return end
        local delta = input.Position - dragStart
        if delta.Magnitude > 6 then moved = true end
        if moved then
            objectToMove.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + delta.X, startPos.Y.Scale, startPos.Y.Offset + delta.Y)
        end
    end)
    UserInputService.InputEnded:Connect(function(input)
        if not isClickInput(input) or not dragging then return end
        dragging = false
        if not moved and callback then callback() end
    end)
end

_load = loadstring or load

function httpGetTexto(url)
    local ok, res = pcall(function() return game:HttpGet(url) end)
    if ok and type(res) == "string" and #res > 2000 then return res end
    return nil
end

function construirDesdeCodigo(code)
    if type(code) ~= "string" or #code < 2000 then return nil end
    if not string.find(code, "CreateWindow", 1, true) then return nil end
    local fn = _load(code)
    if not fn then return nil end
    local okRun, res = pcall(fn)
    if okRun and type(res) == "table" then return res end
    return nil
end

cargado = false
if type(getgenv().WindUI) == "table" then
    WindUI = getgenv().WindUI
    cargado = true
end

if not cargado and isfile and readfile and isfile(uiFileName) then
    local okRead, code = pcall(readfile, uiFileName)
    if okRead and code then
        local lib = construirDesdeCodigo(code)
        if lib then WindUI = lib; cargado = true end
    end
end

if not cargado then
    for _, url in ipairs(UI_MIRRORS) do
        local code = httpGetTexto(url)
        local lib = code and construirDesdeCodigo(code)
        if lib then
            WindUI = lib
            cargado = true
            if writefile then pcall(writefile, uiFileName, code) end

end

      fly: `-- ===== FLY TÁCTIL + PANELES =====
flyEnabled = false
flySpeed = 55
flyConn = nil
flyInput = { f = false, b = false, l = false, r = false, u = false, d = false }

function flyStop()
    if not flyEnabled then return end
    flyEnabled = false
    if flyConn then flyConn:Disconnect() flyConn = nil end
    local hum = player.Character and player.Character:FindFirstChildOfClass("Humanoid")
    if hum then pcall(function() hum.PlatformStand = false end) end
end

function flyStart()
    if flyEnabled then return end
    local char = player.Character
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    local hum = char and char:FindFirstChildOfClass("Humanoid")
    if not hrp or not hum then return end
    flyEnabled = true
    pcall(function() hum.PlatformStand = true end)
    flyConn = RunService.RenderStepped:Connect(function(dt)
        if not flyEnabled then return end
        local c = player.Character
        local r = c and c:FindFirstChild("HumanoidRootPart")
        local h = c and c:FindFirstChildOfClass("Humanoid")
        if not r or not h or h.Health <= 0 then flyStop() return end
        local move = Vector3.zero
        if flyInput.f or UserInputService:IsKeyDown(Enum.KeyCode.W) then move += camera.CFrame.LookVector end
        if flyInput.b or UserInputService:IsKeyDown(Enum.KeyCode.S) then move -= camera.CFrame.LookVector end
        if flyInput.r or UserInputService:IsKeyDown(Enum.KeyCode.D) then move += camera.CFrame.RightVector end
        if flyInput.l or UserInputService:IsKeyDown(Enum.KeyCode.A) then move -= camera.CFrame.RightVector end
        if h.MoveDirection.Magnitude > 0.05 then
            move += Vector3.new(h.MoveDirection.X, 0, h.MoveDirection.Z)
        end
        if move.Magnitude > 0.05 then
            r.CFrame = r.CFrame + move.Unit * flySpeed * dt
            r.AssemblyLinearVelocity = Vector3.zero
        end
    end)
end

      speed: `-- ===== SPEED CFRAME =====
speedOriginalWalk = setmetatable({}, { __mode = "k" })
function speedRestaurar(char)
    char = char or player.Character
    if not char then return end
    local hum = char:FindFirstChildOfClass("Humanoid")
    local orig = speedOriginalWalk[char]
    if hum then pcall(function() hum.WalkSpeed = orig or 16 end) end
    speedOriginalWalk[char] = nil
end

RunService.Heartbeat:Connect(function(dt)
    if not speedEnabled then return end
    local char = player.Character
    local hum = char and char:FindFirstChildOfClass("Humanoid")
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    if not hum or not hrp or hum.Health <= 0 then return end
    local objetivo = speedValue
    if speedVariacion then
        speedVarTimer = speedVarTimer + dt
        if speedVarTimer >= 0.9 then
            speedVarTimer = 0
            speedVarActual = (math.random() * 2 - 1) * 1.5
        end
        objetivo = math.max(16, speedValue + speedVarActual)
    end
    local dir = hum.MoveDirection
    if dir.Magnitude > 0.1 then
        local extra = math.max(0, objetivo - hum.WalkSpeed)
        if extra > 0 then
            hrp.CFrame = hrp.CFrame + Vector3.new(dir.X, 0, dir.Z).Unit * extra * dt
        end
    end
end)

      under: `-- ===== UNDER MAP =====
function underDetener()
    underEnabled = false
    if underConn then underConn:Disconnect() underConn = nil end
    local hum = player.Character and player.Character:FindFirstChildOfClass("Humanoid")
    if hum then pcall(function() hum.PlatformStand = false end) end
end

function underIniciar()
    if underEnabled then return end
    local char = player.Character
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    local hum = char and char:FindFirstChildOfClass("Humanoid")
    if not hrp or not hum then return end
    local params = RaycastParams.new()
    params.FilterType = Enum.RaycastFilterType.Exclude
    params.FilterDescendantsInstances = { char }
    local res = workspace:Raycast(hrp.Position + Vector3.new(0, 2, 0), Vector3.new(0, -600, 0), params)
    underFloorY = res and res.Position.Y or (hrp.Position.Y - 6)
    underEnabled = true
    pcall(function() hum.PlatformStand = true end)
    underConn = RunService.Heartbeat:Connect(function(dt)
        if not underEnabled then return end
        local c = player.Character
        local r = c and c:FindFirstChild("HumanoidRootPart")
        local h = c and c:FindFirstChildOfClass("Humanoid")
        if not r or not h or h.Health <= 0 or not underFloorY then underDetener() return end
        local dx, dz = 0, 0
        if h.MoveDirection.Magnitude > 0.1 then
            dx = h.MoveDirection.X * underSpeed * dt
            dz = h.MoveDirection.Z * underSpeed * dt
        end
        r.CFrame = CFrame.new(r.Position.X + dx, underFloorY - underDepth, r.Position.Z + dz)
        r.AssemblyLinearVelocity = Vector3.zero
    end)
end

    function makeControl(type, tabRef) {
      const t = tabRef || `Tabs.${selectedTab}`;
      if (type === "button") {
        return `${t}:Button({\n    Title = "Botón",\n    Desc = "Ejecuta una acción",\n    Callback = function()\n        notify("ALEX", "Botón presionado.")\n    end\n})`;
      }
      if (type === "toggle") {
        return `${t}:Toggle({\n    Title = "Toggle",\n    Desc = "Activa o desactiva",\n    Value = false,\n    Callback = function(v)\n        warn("Toggle:", v)\n    end\n})`;
      }
      if (type === "slider") {
        return `${t}:Slider({\n    Title = "Slider",\n    Step = 1,\n    Value = { Min = 0, Max = 100, Default = 50 },\n    Callback = function(v)\n        warn("Slider:", v)\n    end\n})`;
      }
      if (type === "dropdown") {
        return `${t}:Dropdown({\n    Title = "Dropdown",\n    Values = { "Opción 1", "Opción 2", "Opción 3" },\n    Value = "Opción 1",\n    Callback = function(v)\n        warn("Dropdown:", v)\n    end\n})`;
      }
      if (type === "input") {
        return `${t}:Input({\n    Title = "Input",\n    Placeholder = "Escribe aquí...",\n    Callback = function(txt)\n        warn("Input:", txt)\n    end\n})`;
      }
      if (type === "colorpicker") {
        return `${t}:Colorpicker({\n    Title = "Colorpicker",\n    Default = Color3.fromRGB(0, 170, 255),\n    Callback = function(c)\n        warn("Color:", c)\n    end\n})`;
      }
      if (type === "keybind") {
        return `${t}:Keybind({\n    Title = "Keybind",\n    Value = "RightControl",\n    Callback = function(k)\n        warn("Keybind:", k)\n    end\n})`;
      }
      if (type === "paragraph") {
        return `${t}:Paragraph({\n    Title = "Información",\n    Desc = "Detalle del módulo en ${selectedTab}"\n})`;
      }
      if (type === "notify") {
        return `Window:Notify({\n    Title = "ALEX",\n    Content = "Notificación desde ${selectedTab}",\n    Duration = 3\n})`;
      }
      return "";
    }

    function buildFullHub() {
      return [
        CORE_WINDOW_SETUP,
        MODULES.aim,
        MODULES.esp,
        MODULES.farm,
        MODULES.fly,
        MODULES.speed,
        MODULES.under,
        MODULES.struct,
        MODULES.killall,
        MODULES.duel,
        MODULES.anims,
        MODULES.sounds,
        MODULES.music,
        MODULES.themes,
        MODULES.emotes,
        MODULES.items,
        MODULES.configs
      ].join("\n\n");
    }

    let currentScript = buildFullHub();
    let customTabCounter = 1;

    const luaCodeView = document.getElementById("luaCodeView");
    const lineStats = document.getElementById("lineStats");
    const statusLabel = document.getElementById("statusLabel");
    const activeTabIndicator = document.getElementById("activeTabIndicator");
    const fullMenuPanel = document.getElementById("fullMenuPanel");
    const tabsGrid = document.getElementById("tabsGrid");
    const promptBox = document.getElementById("promptBox");

    function renderAll(code) {
      currentScript = code;
      luaCodeView.textContent = currentScript;
      const totalLines = currentScript.split("\n").length;
      lineStats.textContent = `${totalLines} líneas`;
      activeTabIndicator.textContent = `Pestaña activa: Tabs.${selectedTab}`;
    }

    function buildTabsButtons() {
      tabsGrid.innerHTML = "";
      TAB_NAMES.forEach((name) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = name;
        const active = name === selectedTab;
        b.className = active
          ? "px-2.5 py-1 text-[11px] rounded-lg bg-white text-black font-medium"
          : "px-2.5 py-1 text-[11px] rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:border-zinc-600";
        b.addEventListener("click", () => {
          selectedTab = name;
          buildTabsButtons();
          renderAll(currentScript);
          statusLabel.textContent = `Pestaña: ${name}`;
        });
        tabsGrid.appendChild(b);
      });
    }

    document.getElementById("toggleMenuBtn").addEventListener("click", () => {
      fullMenuPanel.classList.toggle("hidden");
    });

    document.getElementById("loadFullHubBtn").addEventListener("click", () => {
      renderAll(buildFullHub());
      statusLabel.textContent = "Todo el menú y módulos cargados";
    });

    document.getElementById("copyAllBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentScript);
        statusLabel.textContent = "Copiado al portapapeles";
      } catch {
        statusLabel.textContent = "Selecciona y copia";
      }
    });

    document.querySelectorAll(".win-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const wType = btn.dataset.win;
        const label = (promptBox.value.trim() || `Extra ${customTabCounter++}`).replace(/"/g, "");
        if (wType === "newWindow") {
          const snippet = `ExtraWindow_${customTabCounter} = WindUI:CreateWindow({\n    Title = "${label}",\n    Author = "ALEX",\n    Folder = "Alex_Extra_${customTabCounter}",\n    Theme = "Dark"\n})`;
          renderAll(currentScript + "\n\n" + snippet);
          statusLabel.textContent = `Window agregada: ${label}`;
        } else if (wType === "newTab") {
          const safeKey = `CustomTab_${customTabCounter}`;
          const snippet = `Tabs.${safeKey} = MainSection:Tab({ Title = "${label}", Icon = "solar:star-bold" })`;
          renderAll(currentScript + "\n\n" + snippet);
          statusLabel.textContent = `Tab agregada: ${label}`;
        } else if (wType === "newSection") {
          const snippet = `Tabs.${selectedTab}:Section({ Title = "${label}", Icon = "solar:widget-bold" })`;
          renderAll(currentScript + "\n\n" + snippet);
          statusLabel.textContent = `Section en ${selectedTab}`;
        }
      });
    });

    document.querySelectorAll(".ctrl-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const cType = btn.dataset.ctrl;
        renderAll(currentScript + "\n\n" + makeControl(cType));
        statusLabel.textContent = `+ ${btn.textContent.replace("+ ", "")} en ${selectedTab}`;
      });
    });

    document.querySelectorAll(".mod-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const mKey = btn.dataset.mod;
        if (MODULES[mKey]) {
          renderAll(currentScript + "\n\n" + MODULES[mKey]);
          statusLabel.textContent = `Módulo agregado: ${btn.textContent.replace("+ ", "")}`;
        }
      });
    });

    document.getElementById("promptBar").addEventListener("submit", (e) => {
      e.preventDefault();
      const raw = promptBox.value.trim();
      if (!raw) return;
      const q = raw.toLowerCase();
      let out = currentScript;

      if (q.includes("fly")) out += "\n\n" + MODULES.fly;
      if (q.includes("speed") || q.includes("velocidad")) out += "\n\n" + MODULES.speed;
      if (q.includes("under")) out += "\n\n" + MODULES.under;
      if (q.includes("martillo") || q.includes("delete") || q.includes("estructura")) out += "\n\n" + MODULES.struct;
      if (q.includes("kill") || q.includes("hitbox")) out += "\n\n" + MODULES.killall;
      if (q.includes("aim") || q.includes("fov")) out += "\n\n" + MODULES.aim;
      if (q.includes("esp")) out += "\n\n" + MODULES.esp;
      if (q.includes("farm")) out += "\n\n" + MODULES.farm;
      if (q.includes("1v1") || q.includes("duel") || q.includes("pad")) out += "\n\n" + MODULES.duel;
      if (q.includes("anim")) out += "\n\n" + MODULES.anims;
      if (q.includes("sonido") || q.includes("kill sound")) out += "\n\n" + MODULES.sounds;
      if (q.includes("musica") || q.includes("música")) out += "\n\n" + MODULES.music;
      if (q.includes("fondo") || q.includes("tema")) out += "\n\n" + MODULES.themes;
      if (q.includes("emote")) out += "\n\n" + MODULES.emotes;
      if (q.includes("headless") || q.includes("korblox")) out += "\n\n" + MODULES.items;
      if (q.includes("config") || q.includes("guardar")) out += "\n\n" + MODULES.configs;
      if (q.includes("boton") || q.includes("botón")) out += "\n\n" + makeControl("button");
      if (q.includes("toggle")) out += "\n\n" + makeControl("toggle");
      if (q.includes("slider")) out += "\n\n" + makeControl("slider");
      if (q.includes("dropdown")) out += "\n\n" + makeControl("dropdown");

      if (out === currentScript) {
        out += `\n\nTabs.${selectedTab}:Section({ Title = "${raw.slice(0, 36).replace(/"/g, "")}" })\n` + makeControl("button");
      }

      renderAll(out);
      statusLabel.textContent = "Agregado al script";
    });

    buildTabsButtons();
    renderAll(currentScript);
  </script>
</body>
