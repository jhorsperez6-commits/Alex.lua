<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Key System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #121311; border: 1px solid #232632; padding: 30px; border-radius: 14px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
        h1 { color: #00a2ff; font-size: 22px; margin-bottom: 8px; }
        p { color: #8c91a0; font-size: 13px; margin-bottom: 25px; }
        .btn { background-color: #00a2ff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 15px; transition: background 0.2s; }
        .btn:hover { background-color: #0088db; }
        .key-box { background-color: #1a1c26; border: 1px dashed #00a2ff; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; word-break: break-all; }
        .key-text { color: #00ff80; font-family: monospace; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SERVE PENE HUB</h1>
        <p>Sistema de Keys Oficial</p>

        <!-- AQUÍ PEGAS TU ENLACE DE LINKVERTISE / SAFELINK -->
        <a href="https://linkvertise.com/TU_LINK_DE_PUBLICIDAD" id="stepBtn" class="btn" onclick="desbloquearKey()">1. OBTENER KEY (PASAR ANUNCIO)</a>

        <div id="keyContainer" class="key-box">
            <p style="font-size: 11px; margin-bottom: 5px;">Tu Key Generada (Válida por 10 horas):</p>
            <div class="key-text" id="generatedKey">SPH-XXXX-XXXX</div>
            <button class="btn" style="margin-bottom:0; padding:8px; font-size:12px;" onclick="copiarKey()">Copiar Key</button>
        </div>
    </div>

    <script>
        function generarKeyUnica() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "SPH-";
            for (let i = 0; i < 8; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        function desbloquearKey() {
            localStorage.setItem("keyGenerada", generarKeyUnica());
            localStorage.setItem("tiempoKey", Date.now() + 36000000); // 10 horas
        }

        window.onload = function() {
            const savedKey = localStorage.getItem("keyGenerada");
            const expireTime = localStorage.getItem("tiempoKey");

            if (savedKey && expireTime && Date.now() < expireTime) {
                document.getElementById("stepBtn").style.display = "none";
                document.getElementById("keyContainer").style.display = "block";
                document.getElementById("generatedKey").innerText = savedKey;
            } else {
                localStorage.removeItem("keyGenerada");
                localStorage.removeItem("tiempoKey");
            }
        }

        function copiarKey() {
            const keyText = document.getElementById("generatedKey").innerText;
            navigator.clipboard.writeText(keyText);
            alert("¡Key copiada al portapapeles!");
        }
    </script>

</body>
</html>
