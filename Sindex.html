<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Key System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0b0c10, #1f2833); color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 35px 25px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); }
        h1 { color: #00bfff; font-size: 24px; margin-bottom: 5px; font-weight: 700; letter-spacing: 1px; }
        .subtitle { color: #8c91a0; font-size: 13px; margin-bottom: 30px; }
        .btn { background: linear-gradient(135deg, #00bfff, #0077ff); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 15px; transition: transform 0.2s, opacity 0.2s; box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3); }
        .btn:active { transform: scale(0.98); }
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .key-title { font-size: 12px; color: #8c91a0; margin-bottom: 8px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 16px; font-weight: bold; margin-bottom: 12px; word-break: break-all; }
        .btn-copy { background: #232733; color: #00ff88; border: 1px solid #00ff88; padding: 10px; font-size: 13px; margin-bottom: 0; box-shadow: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">Sistema de Keys Oficial</div>

        <!-- AQUÍ PEGAS TU ENLACE DE LINKVERTISE / SAFELINK -->
        <a href="https://linkvertise.com/TU_LINK_DE_PUBLICIDAD" id="stepBtn" class="btn" onclick="activarKey()">OBTENER KEY (PASAR ANUNCIO)</a>

        <div id="keyContainer" class="key-box">
            <div class="key-title">Tu Key generada con éxito:</div>
            <div class="key-text" id="generatedKey">SPH-XXXX-XXXX</div>
            <button class="btn btn-copy" onclick="copiarKey()">Copiar Key al Portapapeles</button>
        </div>
    </div>

    <script>
        function generarKeyUnica() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "SPH-";
            for (let i = 0; i < 8; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        function activarKey() {
            // Guarda una nueva key que dura 12 horas
            const nuevaKey = generarKeyUnica();
            localStorage.setItem("sph_key", nuevaKey);
            localStorage.setItem("sph_expire", Date.now() + 43200000); 
        }

        window.onload = function() {
            const savedKey = localStorage.getItem("sph_key");
            const expireTime = localStorage.getItem("sph_expire");

            if (savedKey && expireTime && Date.now() < expireTime) {
                document.getElementById("stepBtn").style.display = "none";
                document.getElementById("keyContainer").style.display = "block";
                document.getElementById("generatedKey").innerText = savedKey;
            } else {
                localStorage.removeItem("sph_key");
                localStorage.removeItem("sph_expire");
            }
        }

        function copiarKey() {
            const keyText = document.getElementById("generatedKey").innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("¡Key copiada! Ya puedes usarla en tu ejecutor.");
            });
        }
    </script>

</body>
</html>
